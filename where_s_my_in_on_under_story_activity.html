<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Where's My...? (in / on / under) - Fun English Story Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

            --dark-orange: #d35400;

            --bg-body: #fffaf0;
            --bg-card: #ffffff;
            --bg-cream: #fff3dd;
            --text-main: #2c3e50;
            --accent-pink: #ff78ae;
            --accent-pink-dark: #d64d8a;
            --accent-blue: #3498db;
            --accent-blue-dark: #2980b9;
            --accent-green: #2ecc71;
            --accent-green-dark: #27ae60;
            --accent-purple: #9b59b6;
            --accent-purple-dark: #763e8f;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Neue', 'Zen Maru Gothic', cursive, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            padding: 24px 28px;
            width: 100%;
            max-width: 880px;
            text-align: center;
            border: 6px dashed var(--border-warm);
            position: relative;
            min-height: 590px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Navigation & Progress Bar */
        .top-bar {

            justify-content: space-between;

            border-bottom: 3px dashed #fdebd0;
            padding-bottom: 12px;
            margin-bottom: 16px;

        }

        .progress-badge {
            background: #fef5e7;
            border: 2px solid #f5b041;
            color: var(--dark-orange);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .back-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #7f8c8d;
            transition: 0.1s;
        }
        .back-btn:hover { background: #7f8c8d; }
        .back-btn:active { transform: translateY(3px); box-shadow: none; }

        /* Speaker Button (Manual Playback Only) */
        .speaker-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-pink-dark);
            display: inline-flex;
            align-items: center;

        .speaker-btn:hover { background: #ff5c9d; }

        .speaker-btn.purple {

        .speaker-btn.mini {

        /* Action / Next Buttons */

        .nav-btn.orange {

        .nav-btn.blue {

        /* Cover Page (Page 0) */

        /* Clue Area */
        .clue-wrapper {
            width: 100%;
            max-width: 520px;

        .clue-hidden-box {

            border: 4px solid #f5b041;

        .clue-svg-stage {
            width: 100%;

        .clue-prompt-bar {

            border-top: 2px dashed #f5b041;
            padding: 10px 16px;
            font-size: 1.65rem;
            font-weight: 700;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;

        .blank-slot {
            display: inline-block;

            background: white;
            border: 3px dashed #3498db;
            border-radius: 14px;

            border: 3px solid #2ecc71;

        /* Choice Buttons (in / on / under) */
        .choices-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 8px 0 14px 0;
            flex-wrap: wrap;
        }

        .choice-btn {
            min-width: 135px;
            padding: 14px 28px;
            font-size: 1.85rem;
            font-family: inherit;
            font-weight: 700;
            border-radius: 22px;
            border: 4px solid #dfe6e9;
            background: #ffffff;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 6px 0 #b2bec3;
            transition: transform 0.1s, background 0.15s, border-color 0.15s;

        .choice-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #f39c12;
            background: #fffdf5;
        }

        .choice-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .choice-btn.correct-choice {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
            box-shadow: 0 6px 0 #1e8449;
            transform: scale(1.06);

        .choice-btn.wrong-choice {
            background: #ffebee;
            border-color: #e74c3c;
            color: #c0392b;
            box-shadow: 0 4px 0 #e74c3c;
            animation: shake 0.35s ease-in-out;
        }

        .choice-btn:disabled {
            cursor: default;
            opacity: 0.75;
        }
        .choice-btn.correct-choice:disabled {
            opacity: 1;
        }

        /* Feedback & Post-Answer Discussion Area */
        .feedback-area {
            min-height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .try-again-badge {
            background: #fadbd8;
            color: #c0392b;
            border: 2px solid #e74c3c;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 1.35rem;
            font-weight: 700;
            animation: popIn 0.2s ease-out;
        }

        .correct-panel {
            background: #e8f8f5;
            border: 3px solid #2ecc71;
            border-radius: 22px;
            padding: 14px 24px;
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        .correct-banner-text {
            font-size: 1.9rem;
            font-weight: 700;
            color: #27ae60;
        }

        .answer-read-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .answer-sentence {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Finale Page (Page 8) */
        .finale-stage {
            width: 100%;
            max-width: 640px;

        .finale-line-card {

        .finale-speaker-tag {

            color: white;

        .finale-text {

            font-weight: 700;
            color: #2c3e50;

        .review-header-box {

        .review-title {

            font-weight: 700;

        .review-grid {

        .review-card {

            border-radius: 20px;

            cursor: pointer;

        }

            background: #e8f8f5;

            left: 8px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);

            color: #d35400;
            font-weight: 700;
            font-size: 1rem;

            align-items: center;
            justify-content: center;
            z-index: 2;

        .review-check-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #2ecc71;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 2;
            animation: popIn 0.2s ease-out;
        }

        .review-svg-box {
            width: 100%;
            height: 135px;
            background: #fdfaf4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .review-caption {
            padding: 10px 10px 12px 10px;
            background: #ffffff;
            border-top: 2px dashed #d5f5e3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: popIn 0.2s ease-out;
        }

        .review-sentence {
            font-size: 1.12rem;
            font-weight: 700;
            color: #1e8449;
            line-height: 1.25;
        }

        .review-tap-hint {
            padding: 7px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #95a5a6;
            background: #fffdf9;
            border-top: 2px dashed #f5deb3;
        }

        .footer-btn-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-6px); }
        }

        @media (max-width: 600px) {
            #app-container {
                padding: 16px 14px;
                border-width: 4px;
            }
            .cover-title { font-size: 2.2rem; }
            .intro-cards { grid-template-columns: 1fr; gap: 12px; }
            .question-text { font-size: 1.55rem; }
            .choice-btn { min-width: 96px; padding: 12px 18px; font-size: 1.55rem; }
            .answer-sentence { font-size: 1.45rem; }
            .finale-text { font-size: 1.25rem; }
            .review-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .review-svg-box { height: 110px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Dynamic Content Rendered Here -->
    </div>

    <script>
        /* =========================================================
           1. SPEECH SYNTHESIS (Manual Click Only - No Auto-Play!)
           ========================================================= */
        let preferredVoice = null;

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            const usVoices = voices.filter(v => v.lang === "en-US" || v.lang === "en_US" || v.lang.startsWith("en"));
            preferredVoice =
                usVoices.find(v => v.name.includes("Ava")) ||
                usVoices.find(v => v.name.includes("Ana")) ||
                usVoices.find(v => v.name.includes("Jenny")) ||
                usVoices.find(v => v.name.includes("Google US English")) ||
                usVoices.find(v => v.name.includes("Google English")) ||
                usVoices.find(v => v.name.includes("Samantha")) ||
                usVoices.find(v => v.name.includes("Aria")) ||
                usVoices[0] ||
                voices[0];
        }

        if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            if (!preferredVoice) loadVoices();

            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            if (preferredVoice) uttr.voice = preferredVoice;
            uttr.lang = 'en-US';
            uttr.rate = 0.65;
            uttr.pitch = 1.1;

            window.speechSynthesis.resume();
            window.speechSynthesis.speak(uttr);
        }

        /* =========================================================
           2. STORY & QUIZ DATA (7 Pages + Intro + Finale + Review)
           ========================================================= */
        const quizPages = [
            {
                id: 1,
                speaker: "Anne",
                question: "Where's my red dress?",
                preposition: "on",
                place: "the bed",
                answerSentence: "It's on the bed!",
                reviewSentence: "The red dress is on the bed!",
                anneItems: [],
                kenItems: [],
                sceneType: "dress_on_bed"
            },
            {
                id: 2,
                speaker: "Ken",
                question: "Where's my yellow T-shirt?",
                preposition: "in",
                place: "the box",
                answerSentence: "It's in the box!",
                reviewSentence: "The yellow T-shirt is in the box!",
                anneItems: ["dress"],
                kenItems: [],
                sceneType: "tshirt_in_box"
            },
            {
                id: 3,
                speaker: "Anne",
                question: "Where's my pink bow?",
                preposition: "under",
                place: "the chair",
                answerSentence: "It's under the chair!",
                reviewSentence: "The pink bow is under the chair!",
                anneItems: ["dress"],
                kenItems: ["tshirt"],
                sceneType: "bow_under_chair"
            },
            {
                id: 4,
                speaker: "Ken",
                question: "Where's my green cap?",
                preposition: "on",
                place: "the table",
                answerSentence: "It's on the table!",
                reviewSentence: "The green cap is on the table!",
                anneItems: ["dress", "bow"],
                kenItems: ["tshirt"],
                sceneType: "cap_on_table"
            },
            {
                id: 5,
                speaker: "Anne",
                question: "Where's my orange ring?",
                preposition: "in",
                place: "the cup",
                answerSentence: "It's in the cup!",
                reviewSentence: "The orange ring is in the cup!",
                anneItems: ["dress", "bow"],
                kenItems: ["tshirt", "cap"],
                sceneType: "ring_in_cup"
            },
            {
                id: 6,
                speaker: "Ken",
                question: "Where's my purple ball?",
                preposition: "under",
                place: "the table",
                answerSentence: "It's under the table!",
                reviewSentence: "The purple ball is under the table!",
                anneItems: ["dress", "bow", "ring"],
                kenItems: ["tshirt", "cap"],
                sceneType: "ball_under_table"
            },
            {
                id: 7,
                speaker: "Anne & Ken",
                question: "Where's Mom's blue bag?",
                preposition: "on",
                place: "the sofa",
                answerSentence: "It's on the sofa!",
                reviewSentence: "Mom's blue bag is on the sofa!",
                anneItems: ["dress", "bow", "ring"],
                kenItems: ["tshirt", "cap", "ball"],
                sceneType: "bag_on_sofa"
            }

                    <path d="M94 96 Q110 86 114 74" fill="none" stroke="#ffe0b2" stroke-width="8" stroke-linecap="round"/>
                    <rect x="63" y="80" width="14" height="14" rx="5" fill="#ffe0b2" />
                    <circle cx="70" cy="63" r="27" fill="#ffe0b2" />
                    <!-- Smooth Rounded Short Hair -->
                    <path d="M41 61 C38 25, 102 25, 99 61 C92 52, 82 50, 74 53 C66 49, 53 51, 41 61 Z" fill="#37474f" />
                    <ellipse cx="53" cy="69" rx="5" ry="3" fill="#ffab91" opacity="0.75" />
                    <ellipse cx="87" cy="69" rx="5" ry="3" fill="#ffab91" opacity="0.75" />
                    <circle cx="58" cy="62" r="3.5" fill="#263238" />
                    <circle cx="82" cy="62" r="3.5" fill="#263238" />
                    <path d="M61 73 Q70 83 79 73" fill="none" stroke="#d84315" stroke-width="3" stroke-linecap="round" />
                    <!-- Green Cap -->
                    <path d="M43 46 C43 24, 97 24, 97 46 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="2.5" />
                    <path d="M41 46 Q74 52 109 45 Q96 39 41 46 Z" fill="#27ae60" />
                    <!-- Purple Ball -->
                    <circle cx="105" cy="112" r="15" fill="#9b59b6" stroke="#6c3483" stroke-width="2.5" />
                    <path d="M93 106 Q105 114 117 106" fill="none" stroke="#e8daef" stroke-width="2.5" />
                </g>
            </svg>`;
        }

        /* =========================================================
           5. PAGE RENDERING & INTERACTIONS
           ========================================================= */
        function goToPage(pageNum) {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            currentPage = pageNum;
            renderApp();
        }

        function revealClue(pageId) {
            pageStates[pageId].clueRevealed = true;
            renderApp();
        }

        function handleChoice(pageId, selectedPrep) {
            const pageData = quizPages.find(p => p.id === pageId);
            const state = pageStates[pageId];
            if (state.solved) return;

            if (selectedPrep === pageData.preposition) {
                state.solved = true;
                state.showTryAgain = false;
                state.clueRevealed = true;
            } else {
                state.wrongChoices.add(selectedPrep);
                state.showTryAgain = true;
            }
            renderApp();
        }

        function toggleReviewCard(id) {
            if (reviewSelected.has(id)) {
                reviewSelected.delete(id);
            } else {
                reviewSelected.add(id);
            }
            renderApp();
        }

        function resetReviewMarks() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            reviewSelected.clear();
            renderApp();
        }

        function resetGame() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            initStates();
            currentPage = 0;
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById("app-container");

            /* --- PAGE 0: COVER / INTRO --- */
            if (currentPage === 0) {
                container.innerHTML = `
                    <div>
                        <div class="cover-title">🔍 Where's My...? 🔍</div>
                        <div class="cover-subtitle">in / on / under Story Activity</div>
                    </div>

                    <div class="intro-cards">
                        <div class="intro-char-card">
                            ${getAnneSVG([], 125)}
                            <div class="intro-speech">Hi, I'm Anne!</div>
                            <button class="speaker-btn" onclick="speak(&quot;Hi, I'm Anne!&quot;)">🔊 Listen</button>
                        </div>
                        <div class="intro-char-card">
                            ${getKenSVG([], 125)}
                            <div class="intro-speech">Hi, I'm Ken!</div>
                            <button class="speaker-btn" onclick="speak(&quot;Hi, I'm Ken!&quot;)">🔊 Listen</button>
                        </div>
                    </div>

                    <div style="margin-bottom: 10px;">
                        <button class="nav-btn orange" onclick="goToPage(1)">Start Story ▶</button>
                    </div>
                `;
                return;
            }

            /* --- PAGE 8: FINALE --- */
            if (currentPage === 8) {
                container.innerHTML = `
                    <div class="top-bar">
                        <button class="back-btn" onclick="goToPage(7)">◀ Back</button>
                        <div class="progress-badge">🎉 Happy Ending! 🎉</div>
                        <div style="width: 85px;"></div>
                    </div>

                    <div class="finale-stage">
                        ${getFinaleSVG()}
                    </div>

                    <div class="finale-dialogue-list">
                        <div class="finale-line-card">
                            <span class="finale-speaker-tag" style="background:#e84393;">Mom</span>
                            <span class="finale-text">Here is my blue bag! Thank you, Anne and Ken!</span>
                            <button class="speaker-btn" onclick="speak(&quot;Here is my blue bag! Thank you, Anne and Ken!&quot;)">🔊 Listen</button>
                        </div>
                        <div class="finale-line-card" style="background:#fff9e6; border-color:#f39c12;">
                            <span class="finale-speaker-tag" style="background:#e67e22;">Everyone</span>
                            <span class="finale-text" style="color:#d35400; font-size:1.7rem;">Let's go shopping! 🛍️✨</span>
                            <button class="speaker-btn purple" onclick="speak(&quot;Let's go shopping!&quot;)">🔊 Listen</button>
                        </div>
                    </div>

                    <div class="footer-btn-row">
                        <button class="nav-btn blue" onclick="goToPage(9)">Review All! 🔍</button>
                        <button class="nav-btn" onclick="resetGame()">Play Again 🔄</button>
                    </div>
                `;
                return;
            }

            /* --- PAGE 9: POINT & REVIEW ALL 7 SCENES --- */
            if (currentPage === 9) {
                const cardsHTML = quizPages.map(item => {
                    const isPointed = reviewSelected.has(item.id);
                    const escapedSentence = item.reviewSentence.replace(/"/g, "&quot;");
                    return `
                        <div class="review-card ${isPointed ? 'pointed' : ''}" onclick="toggleReviewCard(${item.id})">
                            <div class="review-num-badge">${item.id}</div>
                            ${isPointed ? `<div class="review-check-badge">✓ Found!</div>` : ''}
                            <div class="review-svg-box">
                                ${getClueSceneSVG(item.sceneType)}
                            </div>
                            ${isPointed ? `
                                <div class="review-caption">
                                    <div class="review-sentence">${item.reviewSentence}</div>
                                    <button class="speaker-btn mini" onclick="event.stopPropagation(); speak(&quot;${escapedSentence}&quot;)">🔊 Listen</button>
                                </div>
                            ` : `
                                <div class="review-tap-hint">👆 Point &amp; Tap!</div>
                            `}
                        </div>
                    `;
                }).join("");

                container.innerHTML = `
                    <div class="top-bar">
                        <button class="back-btn" onclick="goToPage(8)">◀ Back</button>
                        <div class="progress-badge">🌟 Point &amp; Review! 🌟</div>
                        <div style="width: 85px;"></div>
                    </div>

                    <div class="review-header-box">
                        <h2 class="review-title">Listen and Point to the Picture! 🔍</h2>
                        <div class="review-guide">先生が言った絵を指さしてタップしよう！（例: "The orange ring is in the cup!"）</div>
                    </div>

                    <div class="review-grid">
                        ${cardsHTML}
                    </div>

                    <div class="footer-btn-row">
                        <button class="nav-btn orange" onclick="resetReviewMarks()">Reset Marks 🔄</button>
                        <button class="nav-btn" onclick="resetGame()">Play Again 🏠</button>
                    </div>
                `;
                return;
            }

            /* --- PAGES 1 to 7: STORY QUIZ --- */
            const data = quizPages.find(p => p.id === currentPage);
            const state = pageStates[currentPage];

            let avatarHTML = "";
            if (data.speaker === "Anne") {
                avatarHTML = `<div class="char-avatar-box">${getAnneSVG(data.anneItems, 80)}</div>`;
            } else if (data.speaker === "Ken") {
                avatarHTML = `<div class="char-avatar-box">${getKenSVG(data.kenItems, 80)}</div>`;
            } else {
                avatarHTML = `
                <div class="char-avatar-duo">
                    ${getAnneSVG(data.anneItems, 64)}
                    ${getKenSVG(data.kenItems, 64)}
                </div>`;
            }

            let clueHTML = "";
            if (!state.clueRevealed) {
                clueHTML = `
                <div class="clue-hidden-box" onclick="revealClue(${data.id})">
                    <button class="clue-reveal-btn">🔍 Show Clue!</button>
                    <div class="clue-sub-jp">タップしてヒントの絵を見よう！</div>
                </div>`;
            } else {
                clueHTML = `
                <div class="clue-picture-card">
                    <div class="clue-svg-stage">
                        ${getClueSceneSVG(data.sceneType)}
                    </div>
                    <div class="clue-prompt-bar">
                        <span>It's</span>
                        <span class="blank-slot ${state.solved ? 'solved' : ''}">
                            ${state.solved ? data.preposition : '?'}
                        </span>
                        <span>${data.place}.</span>
                    </div>
                </div>`;
            }

            const choices = ["in", "on", "under"];
            const choicesHTML = choices.map(prep => {
                const isCorrectBtn = state.solved && prep === data.preposition;
                const isWrongBtn = state.wrongChoices.has(prep);
                let btnClass = "choice-btn";
                if (isCorrectBtn) btnClass += " correct-choice";
                else if (isWrongBtn) btnClass += " wrong-choice";

                return `<button class="${btnClass}" ${state.solved ? 'disabled' : ''} onclick="handleChoice(${data.id}, '${prep}')">${prep}</button>`;
            }).join("");

            let feedbackHTML = "";
            if (state.solved) {
                const nextTarget = currentPage < 7 ? currentPage + 1 : 8;
                const nextLabel = currentPage < 7 ? "Next ➔" : "Ending ➔";
                feedbackHTML = `
                <div class="correct-panel">
                    <div class="correct-banner-text">🎉 Correct! 🎉</div>
                    <div class="answer-read-row">
                        <span class="answer-sentence">"${data.answerSentence}"</span>
                        <button class="speaker-btn purple" onclick="speak(&quot;${data.answerSentence}&quot;)">🔊 Listen</button>
                    </div>
                    <button class="nav-btn" style="margin-top:4px; padding: 10px 34px; font-size: 1.3rem;" onclick="goToPage(${nextTarget})">${nextLabel}</button>
                </div>`;
            } else if (state.showTryAgain) {
                feedbackHTML = `<div class="try-again-badge">Try again! 絵をよく見てみよう 👀</div>`;
            }

            const escapedQuestion = data.question.replace(/"/g, "&quot;");

            container.innerHTML = `
                <div class="top-bar">
                    <button class="back-btn" onclick="goToPage(${currentPage - 1})">◀ Back</button>
                    <div class="progress-badge">Page ${currentPage} / 7</div>
                    <div style="width: 85px;"></div>
                </div>

                <div class="question-banner">
                    ${avatarHTML}
                    <div class="question-content">
                        <span class="speaker-label">${data.speaker}</span>
                        <div class="question-text-row">
                            <h2 class="question-text">"${data.question}"</h2>
                            <button class="speaker-btn" onclick="speak(&quot;${escapedQuestion}&quot;)">🔊 Listen</button>
                        </div>
                    </div>
                </div>

                <div class="clue-wrapper">
                    ${clueHTML}
                </div>

                <div class="choices-row">
                    ${choicesHTML}
                </div>

                <div class="feedback-area">
                    ${feedbackHTML}
                </div>
            `;
        }

        // Initial Render
        renderApp();
    </script>
</body>
</html>
